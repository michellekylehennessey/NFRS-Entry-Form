# admin/config.yml
backend:
  name: github
  repo: michellekylehennessey/NFRS-Entry-Form
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "config"
    label: "Form Settings"
    files:
      - name: "shows"
        label: "Show Settings (shows.json)"
        file: "shows.json"
        format: "json"
        fields:
          - { label: "Version", name: "version", widget: "number", value_type: "int" }

          - label: "Show Types"
            name: "showTypes"
            widget: "list"
            summary: "{{fields.label}}"
            fields:
              - { label: "ID", name: "id", widget: "string" }
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Entry Price", name: "entryPrice", widget: "number", value_type: "float" }
              - { label: "Tank Price", name: "tankPrice", widget: "number", value_type: "float" }
              - { label: "Max Tanks", name: "maxTanks", widget: "number", value_type: "int" }
              - { label: "Allow Dual Entry", name: "allowDualEntry", widget: "boolean", default: false }
              - { label: "Allow Self Show", name: "allowSelfShow", widget: "boolean", default: false }
              - { label: "Allow Marked Show", name: "allowMarkedShow", widget: "boolean", default: false }
